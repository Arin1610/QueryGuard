version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: queryguard
      POSTGRES_PASSWORD: password
      POSTGRES_DB: queryguard
    ports:
      - "5432:5432"